# agent-cal: list calendars, read events, create events in the owner's iCloud calendars over CalDAV.
# Holds an Apple app-specific password, which isn't scoped (it also opens iCloud Mail), so Navi
# never sees it. See agent-cal's header for the verbs.
USER=calbot
CALLERS="openclaw"
SECRET=caldav.env
PYREQS=requirements.txt
