name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # same-repo, non-draft PRs only: fork PRs never get the secret, so skip them instead of failing
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # this repo is public, so Actions logs are too: keep the transcript out of them
          show_full_output: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Context: this is the public upstream of a personal AI agent setup (OpenClaw) on a Linux server. It syncs
            into private config repos, where merges to main deploy automatically.
            Users: the admin user (sudo), openclaw (runs the agent), coder (runs Claude Code), gitbot (only holder of
            the GitHub write token).
            Focus on: bugs; commands or docs that won't work as written (permissions, paths, which user runs them);
            security (secrets, privilege, anything that weakens the agent-PR / human-merge model); config that would
            break the gateway; anything personal leaking into this public repo (real names, places, IDs, hostnames,
            tokens).
            Skip style nitpicks.
            Use mcp__github_inline_comment__create_inline_comment for specific lines and `gh pr comment` for one short summary.
            If it looks good, say so in one line.
          claude_args: |
            --model opus
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
