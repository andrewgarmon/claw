name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo, non-draft PRs only: fork PRs never get the secret, so skip them instead of failing.
    # Dependabot's PRs don't get it either (a bump's diff is a version and a SHA; CI still runs).
    # The install's private repo can use a copy of this file.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        env:
          # the commands the reviewer runs (gh pr comment, ...) don't see the action's tokens: the PR it
          # reviews may be the agent's, written to make it run something
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Actions logs on a public repo are public: only show the transcript on private repos
          show_full_output: ${{ github.event.repository.private }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Context: this repo is part of a personal AI agent setup (OpenClaw) on a Linux server: either the public repo
            the server deploys (merges to main deploy automatically) or the install's private repo, mounted in it as a
            pinned submodule at workspace/private (a change there deploys once the public repo's pointer is bumped).
            This repo is ${{ github.event.repository.visibility }}.
            Users: the admin user (sudo), openclaw (runs the agent), coder (runs Claude Code), gitbot (only holder of
            the GitHub write token).
            Focus on: bugs; commands or docs that won't work as written (permissions, paths, which user runs them);
            security (secrets, privilege, anything that weakens the agent-PR / human-merge model); config that would
            break the gateway. If this repo is public, also flag anything personal leaking into it (real names,
            places, IDs, hostnames, tokens).
            Skip style nitpicks.
            Use mcp__github_inline_comment__create_inline_comment for specific lines and `gh pr comment` for one short summary.
            If it looks good, say so in one line.
          claude_args: |
            --model opus
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
